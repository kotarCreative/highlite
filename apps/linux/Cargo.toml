[workspace]

[package]
name = "highlite-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Linux desktop shell for the Highlite capture relay"
publish = false

[[bin]]
name = "highlite-desktop"
path = "src/main.rs"

[lib]
name = "highlite_desktop"
path = "src/lib.rs"

[dependencies]
gtk = "0.18"
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
png = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[dev-dependencies]
tempfile = "3"
