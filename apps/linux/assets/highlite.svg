<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2b35"/>
      <stop offset="0.55" stop-color="#30232d"/>
      <stop offset="1" stop-color="#1d151a"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8ff73"/>
      <stop offset="0.45" stop-color="#efff3d"/>
      <stop offset="1" stop-color="#d9eb25"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9fce"/>
      <stop offset="0.5" stop-color="#ff81bd"/>
      <stop offset="1" stop-color="#f05fa6"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc183"/>
      <stop offset="1" stop-color="#ffad60"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#120d10" flood-opacity="0.45"/>
    </filter>
    <filter id="markerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#120d10" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824pt artwork centered on a 1024 canvas. -->
  <rect x="100" y="96" width="824" height="824" rx="184" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="101.5" y="97.5" width="821" height="821" rx="182.5" fill="none" stroke="#5b4450" stroke-width="3" opacity="0.7"/>
  <path d="M 170 190 C 280 110 560 100 794 178" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.06"/>

  <!-- A single marker swipe grounds the tool in the brand's highlight gesture. -->
  <path d="M 196 748 L 806 632" fill="none" stroke="#efff3d" stroke-width="78" stroke-linecap="round" opacity="0.32"/>
  <path d="M 246 778 L 690 694" fill="none" stroke="#ff81bd" stroke-width="12" stroke-linecap="round" opacity="0.38"/>

  <g transform="rotate(-38 512 512)" filter="url(#markerShadow)">
    <!-- Chisel nib -->
    <path d="M 312 430 L 202 459 L 202 565 L 312 594 Z" fill="url(#nib)" stroke="#30232d" stroke-width="18" stroke-linejoin="round"/>
    <path d="M 226 486 L 272 474" fill="none" stroke="#30232d" stroke-width="9" stroke-linecap="round" opacity="0.4"/>

    <!-- Barrel -->
    <rect x="300" y="422" width="370" height="180" rx="58" fill="url(#barrel)" stroke="#30232d" stroke-width="18"/>
    <rect x="326" y="444" width="304" height="24" rx="12" fill="#ffffff" opacity="0.34"/>
    <rect x="326" y="554" width="304" height="20" rx="10" fill="#30232d" opacity="0.12"/>

    <!-- Brand label band -->
    <rect x="436" y="488" width="126" height="48" rx="16" fill="#30232d"/>
    <rect x="458" y="503" width="82" height="7" rx="3.5" fill="#ff81bd"/>
    <rect x="458" y="516" width="58" height="7" rx="3.5" fill="#efff3d"/>

    <!-- Collar and cap -->
    <rect x="648" y="406" width="42" height="212" rx="16" fill="#30232d"/>
    <rect x="678" y="400" width="162" height="224" rx="54" fill="url(#cap)" stroke="#30232d" stroke-width="18"/>
    <rect x="706" y="424" width="84" height="22" rx="11" fill="#ffffff" opacity="0.34"/>
    <rect x="698" y="424" width="28" height="176" rx="14" fill="#30232d" opacity="0.18"/>
  </g>
</svg>
