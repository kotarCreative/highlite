[package]
name = "highlite-compiler"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Portable compiler for Highlite capture bundles"

[lib]
name = "highlite_compiler"
path = "src/lib.rs"

[[bin]]
name = "highlite-compiler"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
tempfile = "3"
